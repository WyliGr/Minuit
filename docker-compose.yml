services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minuit-backend
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: production
      PORT: "3333"
      HOST: "0.0.0.0"
      TZ: UTC
      APP_KEY: "UkkntcL0pERhBqGrRZx3yCwqD0bbo2T3"
      APP_URL: "http://localhost:3333"
      LOG_LEVEL: info
      DB_PATH: "/app/database/minuit.sqlite"
      CACHE_TTL_MINUTES: "360"
      CORS_ORIGIN: "*"
    volumes:
      - minuit-db:/app/database
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minuit-frontend
    ports:
      - "4321:4321"
    depends_on:
      - backend
    restart: unless-stopped

  swagger:
    image: swaggerapi/swagger-ui:latest
    container_name: minuit-swagger
    ports:
      - "8088:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./backend/openapi.yaml:/spec/openapi.yaml:ro
    restart: unless-stopped

volumes:
  minuit-db:
    driver: local
