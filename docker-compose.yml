services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minuit-backend
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: production
      PORT: "3333"
      HOST: "0.0.0.0"
      TZ: UTC
      APP_URL: "http://localhost:3333"
      LOG_LEVEL: info
      DB_PATH: "/app/database/minuit.sqlite"
      CACHE_TTL_MINUTES: "360"
      SCHEDULES_TZ: "Europe/Paris"
      CORS_ORIGIN: "*"
      # APP_KEY comes from backend/.env (env_file) — keep secrets out of VCS.
    env_file:
      - ./backend/.env
    volumes:
      - minuit-db:/app/database
    restart: unless-stopped

  swagger:
    image: swaggerapi/swagger-ui:latest
    container_name: minuit-swagger
    ports:
      - "8088:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./backend/openapi.yaml:/spec/openapi.yaml:ro
    restart: unless-stopped

volumes:
  minuit-db:
    driver: local
