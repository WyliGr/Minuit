openapi: 3.1.0
info:
  title: Minuit API
  version: 1.0.0
  description: |
    Cinema schedule aggregator for Strasbourg theaters. Fetches showtimes
    from Allocine and serves them through a single cache-first endpoint.

    **Caching:** Responses are cached in SQLite for 6 hours (configurable via
    `CACHE_TTL_MINUTES`). The first request for a given theater+date fetches
    from Allocine (~200ms); subsequent requests return cached data (~10ms).
  license:
    name: MIT

servers:
  - url: http://localhost:3333
    description: Local development
  - url: http://localhost:3333/api/v1
    description: Docker (compose up)

tags:
  - name: Schedules
    description: Theater schedule endpoints
  - name: Health
    description: Service health check

paths:
  /:
    get:
      tags: [Health]
      summary: Health check
      description: Returns service name and status.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                name: minuit
                status: ok

  /api/v1/theater:
    get:
      tags: [Schedules]
      summary: Get theater schedules
      description: |
        Returns movie showtimes for all active theaters.

        **Single day** (`days=N`): returns a flat day object with `theaters[]`.
        **Multi-day range** (`days=FROM-TO`): returns `{ days: [...] }` where each
        element has the same shape as the single-day response.

        - `days=0` (default): today. Past showtimes are filtered out.
        - `days=1`: tomorrow. All showtimes included.
        - `days=0-6`: a 7-day range (today through next 6 days).
        - `days=N`: N days from today (0-30).
        - `days=FROM-TO`: inclusive range, both bounds 0-30, FROM <= TO.

        Showtimes are sorted chronologically. Each theater slice includes
        `lastFetchedAt` (when Allocine was last fetched for this theater+date).
      operationId: getTheaterSchedules
      parameters:
        - name: days
          in: query
          description: |
            Day offset or inclusive range from today.
            - Single number: `0` (default), `1`, ... up to `30`.
            - Range string: `"0-6"` for today through 6 days from now.
            Defaults to `0` if omitted.
          required: false
          schema:
            oneOf:
              - type: integer
                minimum: 0
                maximum: 30
              - type: string
                pattern: '^\d{1,2}-\d{1,2}$'
            default: 0
          examples:
            today:
              value: 0
              summary: Today (default)
            tomorrow:
              value: 1
              summary: Tomorrow
            nextWeek:
              value: 7
              summary: One week from today
            weekRange:
              value: 0-6
              summary: 7-day range (today + next 6 days)
      responses:
        '200':
          description: Successfully retrieved schedules
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SchedulesResponse'
                  - $ref: '#/components/schemas/SchedulesRangeResponse'
              example:
                date: '2026-07-24'
                dayOffset: 0
                displayDate: vendredi 24 juillet
                generatedAt: '2026-07-24T14:03:11.000Z'
                theaters:
                  - slug: ugc-cine-cite
                    name: UGC Ciné Cité
                    lastFetchedAt: '2026-07-24T14:03:11.000Z'
                    films:
                      - title: DUNE PART TWO
                        runtime: 166
                        posterUrl: /api/v1/poster?url=https%3A%2F%2Ffr.web.img6.acsta.net%2Fimg%2Fc5%2F3a%2Fc53a1a379f5efd5c58ae238e530e6927.jpg
                        showtimes:
                          - time: '14:30'
                            startsAt: '2026-07-24T14:30:00'
                            isVost: false
                            isPreview: false
                  - slug: star-st-exupery
                    name: Star St-Exupéry
                    lastFetchedAt: '2026-07-24T14:03:11.000Z'
                    films: []
        '422':
          description: Validation error (invalid or out-of-range `days` parameter)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                errors:
                  - message: The days field must be a number (0-30) or a range like "0-6"
                    rule: days.format
                    field: days

  /api/v1/theaters:
    get:
      tags: [Schedules]
      summary: List active theaters
      description: |
        Returns the list of active theaters (slug, name, isActive).
        This endpoint does NOT call Allocine — it reads directly from the
        `theaters` table and returns instantly. Use it to render filter bars
        or theater lists before schedule data has loaded.
      operationId: listTheaters
      responses:
        '200':
          description: Theater list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TheatersResponse'
              example:
                theaters:
                  - slug: ugc-cine-cite
                    name: UGC Ciné Cité
                    isActive: true
                  - slug: le-cosmos
                    name: Le Cosmos
                    isActive: true

  /api/v1/poster:
    get:
      tags: [Schedules]
      summary: Proxy poster image
      description: |
        Streams a poster image from Allocine's CDN through the backend (same-origin,
        bypasses CORS/hotlink blocks). The `posterUrl` field in schedule responses
        is already rewritten to this proxy URL — the frontend uses it directly as
        `<img src={posterUrl}>`.

        **SSRF guard:** the `url` param must be `https://` and on an `*.acsta.net` host.
      operationId: getPoster
      parameters:
        - name: url
          in: query
          required: true
          description: Full Allocine CDN URL (https only, *.acsta.net host).
          schema:
            type: string
            format: uri
          example: https://fr.web.img6.acsta.net/img/c5/3a/c53a1a379f5efd5c58ae238e530e6927.jpg
      responses:
        '200':
          description: Raw image bytes
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=2592000, immutable
            Content-Type:
              schema:
                type: string
                example: image/jpeg
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '422':
          description: URL missing, not https, or not on an allowed host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

components:
  schemas:
    HealthResponse:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          example: minuit
        status:
          type: string
          example: ok

    SchedulesResponse:
      type: object
      required: [date, dayOffset, displayDate, generatedAt, theaters]
      properties:
        date:
          type: string
          format: date
          description: The target date in YYYY-MM-DD format.
          example: '2026-07-24'
        dayOffset:
          type: integer
          description: The day offset that was requested (0 = today).
          example: 0
        displayDate:
          type: string
          description: Human-readable date in French (weekday day month).
          example: vendredi 24 juillet
        generatedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when this response was assembled.
          example: '2026-07-24T14:03:11.000Z'
        theaters:
          type: array
          description: One entry per active theater, ordered by theater ID.
          items:
            $ref: '#/components/schemas/TheaterSlice'

    SchedulesRangeResponse:
      type: object
      required: [days]
      properties:
        days:
          type: array
          description: One day object per offset in the requested range, in ascending order.
          items:
            $ref: '#/components/schemas/SchedulesResponse'

    TheatersResponse:
      type: object
      required: [theaters]
      properties:
        theaters:
          type: array
          description: Active theaters, ordered by theater ID. Does NOT include schedule data.
          items:
            $ref: '#/components/schemas/TheaterListItem'

    TheaterListItem:
      type: object
      required: [slug, name, isActive]
      properties:
        slug:
          type: string
          example: ugc-cine-cite
        name:
          type: string
          example: UGC Ciné Cité
        isActive:
          type: boolean
          example: true

    TheaterSlice:
      type: object
      required: [slug, name, lastFetchedAt, films]
      properties:
        slug:
          type: string
          description: URL-friendly theater identifier (used as response key).
          example: ugc-cine-cite
        name:
          type: string
          description: Display name of the theater.
          example: UGC Ciné Cité
        lastFetchedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when Allocine was last fetched for this theater+date. Use this (not `generatedAt`) to display data freshness.
          example: '2026-07-24T14:03:11.000Z'
        films:
          type: array
          description: Movies playing at this theater on the target date. Empty if no showtimes.
          items:
            $ref: '#/components/schemas/Film'

    Film:
      type: object
      required: [title, runtime, posterUrl, showtimes]
      properties:
        title:
          type: string
          description: Movie title, uppercased and stripped of quotes.
          example: DUNE PART TWO
        runtime:
          type: integer
          description: Movie runtime in minutes (parsed from Allocine's "Xh YYmin" format).
          example: 166
        posterUrl:
          type: string
          nullable: true
          description: Proxy URL (/api/v1/poster?url=...) — use directly as img src. Null if Allocine provides no poster. Original Allocine CDN URL is stored in the DB; rewriting happens at response time.
          example: /api/v1/poster?url=https%3A%2F%2Ffr.web.img6.acsta.net%2Fimg%2Fc5%2F3a%2Fc53a1a379f5efd5c58ae238e530e6927.jpg
        showtimes:
          type: array
          description: Chronologically sorted showtimes for this film.
          items:
            $ref: '#/components/schemas/Showtime'

    Showtime:
      type: object
      required: [time, startsAt, isVost, isPreview]
      properties:
        time:
          type: string
          description: Showtime in HH:MM format (French locale, 24h).
          example: '14:30'
        startsAt:
          type: string
          description: ISO 8601 timestamp of the showtime start.
          example: '2026-07-24T14:30:00'
        isVost:
          type: boolean
          description: True if the showing is in original version (Version Originale Sous-titrée).
          example: false
        isPreview:
          type: boolean
          description: True if this is a preview screening (avant-première).
          example: false

    ValidationError:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            required: [message, rule, field]
            properties:
              message:
                type: string
                example: The days field must be a number
              rule:
                type: string
                description: VineJS validation rule that failed.
                enum: [days.format, days.range]
                example: days.format
              field:
                type: string
                description: The query parameter that failed validation.
                example: days
